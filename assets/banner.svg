<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orbGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Animation Styles -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.15); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -60; }
      }
      @keyframes badgePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }

      .floating-orb1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .floating-orb2 {
        animation: pulseGlow 10s ease-in-out infinite 3s;
        transform-origin: 1000px 260px;
      }
      .floating-orb3 {
        animation: pulseGlow 9s ease-in-out infinite 1.5s;
        transform-origin: 600px 180px;
      }
      .flow-path {
        stroke-dasharray: 6 6;
        animation: dashFlow 20s linear infinite;
      }
      .pill-group-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .pill-group-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .pill-badge {
        transition: all 0.3s ease;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Ambient Glows (Background Layer) -->
  <circle cx="180" cy="90" r="180" fill="url(#orbGrad1)" class="floating-orb1" />
  <circle cx="1020" cy="270" r="210" fill="url(#orbGrad2)" class="floating-orb2" />
  <circle cx="600" cy="180" r="240" fill="url(#orbGrad3)" class="floating-orb3" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Grant Workflow Flow Lines (Behind Foreground Cards) -->
  <path d="M 80,70 Q 300,30 550,65 T 1120,50" fill="none" stroke="#6366F1" stroke-width="2" opacity="0.4" class="flow-path" />
  <path d="M 80,310 Q 350,330 650,295 T 1120,310" fill="none" stroke="#10B981" stroke-width="2" opacity="0.4" class="flow-path" />

  <!-- Subtle Animated Workflow Step Nodes (Background/Midground) -->
  <g class="pill-group-1" opacity="0.65">
    <!-- Top-Left Pill: Intake -->
    <rect x="70" y="38" width="130" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <circle cx="85" cy="52" r="4" fill="#38BDF8" />
    <text x="96" y="56" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Application Intake</text>

    <!-- Top-Right Pill: Funding -->
    <rect x="1000" y="38" width="130" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <circle cx="1015" cy="52" r="4" fill="#34D399" />
    <text x="1026" y="56" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Fund Disbursement</text>
  </g>

  <g class="pill-group-2" opacity="0.65">
    <!-- Bottom-Left Pill: Review -->
    <rect x="70" y="294" width="130" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <circle cx="85" cy="308" r="4" fill="#818CF8" />
    <text x="96" y="312" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Scoring &amp; Review</text>

    <!-- Bottom-Right Pill: Compliance -->
    <rect x="990" y="294" width="140" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <circle cx="1005" cy="308" r="4" fill="#F59E0B" />
    <text x="1016" y="312" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Audit &amp; Compliance</text>
  </g>

  <!-- Central Glassmorphism Card (Foreground Container) -->
  <rect x="140" y="75" width="920" height="210" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 20px 25px rgba(0, 0, 0, 0.45))" />

  <!-- Foreground Content: Header Tag / Icon -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Small Category Pill -->
    <rect x="-115" y="-18" width="230" height="26" rx="13" fill="#312E81" stroke="#6366F1" stroke-width="1.2" />
    <text x="0" y="-1" fill="#C7D2FE" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">🌟 CURATED ECOSYSTEM 🌟</text>
  </g>

  <!-- Foreground Main Title -->
  <text x="600" y="172" text-anchor="middle" fill="url(#titleGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">
    Awesome Grant Management Software
  </text>

  <!-- Foreground Subtitle -->
  <text x="600" y="210" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
    Top SaaS Solutions &amp; Open-Source Platforms for Grant Lifecycle Management
  </text>

  <!-- Foreground Feature Badges -->
  <g transform="translate(600, 252)" text-anchor="middle">
    <!-- Badge 1: SaaS Leaders -->
    <g transform="translate(-230, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1" />
      <text x="0" y="4" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">🏢 Enterprise SaaS</text>
    </g>

    <!-- Badge 2: Open Source -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1" />
      <text x="0" y="4" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">🔓 Open-Source Tools</text>
    </g>

    <!-- Badge 3: Compliance & Lifecycle -->
    <g transform="translate(230, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="8" fill="#1E293B" stroke="#7C3AED" stroke-width="1" />
      <text x="0" y="4" fill="#A78BFA" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">📊 Full Grant Lifecycle</text>
    </g>
  </g>
</svg>
